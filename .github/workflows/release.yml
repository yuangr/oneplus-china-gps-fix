name: Build and Release Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate module sources
        run: |
          bash -n customize.sh prepare-config.sh post-fs-data.sh service.sh restart.sh tests/test-module.sh
          ! grep -Eq 'curl|/data/vendor/location|mount[[:space:]]+-o[[:space:]]+bind|while[[:space:]]+true' service.sh
          grep -q 'force_psds_injection' service.sh
          grep -q 'service.lock' service.sh

      - name: Package Magisk/APatch Module
        run: |
          zip -r9 OnePlus_China_GPS_BeiDou_Fix.zip META-INF customize.sh prepare-config.sh merge-config.awk gps.conf framework.conf module.prop post-fs-data.sh service.sh restart.sh sepolicy.rule README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: OnePlus_China_GPS_BeiDou_Fix.zip
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
